<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="IDC 网络可观测入门">
  <defs>
    <linearGradient id="idc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#idc-bg)"/>
  <!-- 机柜列：三排接入 -->
  <g fill="#0b1220" opacity="0.85">
    <rect x="14" y="16" width="10" height="7" rx="2"/>
    <rect x="27" y="16" width="10" height="7" rx="2"/>
    <rect x="40" y="16" width="10" height="7" rx="2"/>
    <rect x="27" y="41" width="10" height="7" rx="2"/>
  </g>
  <!-- 链路：接入 → 骨干 → 出口 -->
  <g stroke="#0b1220" stroke-width="2.2" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M19 23V33h13"/>
    <path d="M45 23V33H32"/>
    <path d="M32 33v8"/>
  </g>
  <!-- 探测点：一个采样窗口 -->
  <circle cx="32" cy="33" r="3.2" fill="#0b1220"/>
  <circle cx="32" cy="33" r="6.4" fill="none" stroke="#0b1220" stroke-width="1.2" opacity="0.35"/>
</svg>
